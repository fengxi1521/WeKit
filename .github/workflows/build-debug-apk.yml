name: Build Debug APK

on:
  push:
    branches:
      - ci-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space for build and caches
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Align AGP version for composite builds
        run: |
          # A build cannot mix AGP versions. The scripta checkout pins an older AGP than :app
          # and LSParanoid (both 9.4.1).
          sed -i 's/^agp = "9.3.3"/agp = "9.4.1"/' libs/common/scripta/gradle/libs.versions.toml
          grep -n '^agp' libs/common/scripta/gradle/libs.versions.toml

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Build debug APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./x build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: xfeng-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk

      - name: Publish debug release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release delete debug-build --yes --cleanup-tag || true
          gh release create debug-build \
            --title "Debug build ${COMMIT_SHA:0:8}" \
            --prerelease \
            --notes "Fork debug build of ${COMMIT_SHA}." \
            app/build/outputs/apk/standard/debug/*.apk
